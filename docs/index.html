<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Jobs Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    /* Toptal brand palette (matches vanessamatos-sys/tsp-macro-dashboard) */
    --ink: #262D3D;
    --ink-secondary: #49526A;
    --surface-page: #EBECED;
    --surface-card: #ffffff;
    --tint: #B6D8FF;
    --accent-cyan: #09B6F9;
    --accent-blue: #183A9E;

    --sla-color: #183A9E;      /* SLA section accent */
    --overview-color: #204ECF; /* Overview section accent — lighter blue from the palette, better text contrast than cyan */

    --good-bg: #E3F6ED;  --good-text: #0E6B48;
    --bad-bg: #FBE9E7;   --bad-text: #C0392B;
    --flat-bg: #EBECED;  --flat-text: #49526A;

    --hp-row: #F0F1F2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0 0 24px; background: var(--surface-page); color: var(--ink);
    font-size: 12.5px;
  }
  .titlebar {
    background: var(--ink);
    color: #fff; padding: 12px 28px; text-align: center;
  }
  .titlebar h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: .03em; }
  .titlebar .sub { font-size: 11px; color: var(--tint); }

  .wrap { max-width: 1600px; margin: 0 auto; padding: 0 16px; }

  /* ---------- KPI section ---------- */
  .kpi-controls { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; flex-wrap: wrap; }
  .kpi-controls select, .kpi-controls input, .kpi-controls button {
    font: inherit; padding: 5px 9px; border-radius: 6px; border: 1px solid #ccd0d8;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  .kpi-note { font-size: 10.5px; color: var(--ink-secondary); }
  .date-range { display: none; align-items: center; gap: 6px; }
  .date-range.active { display: flex; }

  .kpi-section-title {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: #fff; padding: 3px 11px; border-radius: 5px; margin: 12px 0 8px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .card {
    background: var(--surface-card); border-radius: 8px; padding: 8px 10px;
    border-top: 3px solid var(--cat-color, var(--ink));
    box-shadow: 0 1px 4px rgba(15,37,110,.08);
  }
  .card .kpi-name {
    font-size: 10px; font-weight: 800; color: var(--cat-color, var(--ink)); margin-bottom: 4px;
    min-height: 24px; line-height: 1.2; text-transform: uppercase; letter-spacing: .02em;
  }
  .card .value-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .card .value { font-size: 19px; font-weight: 800; color: var(--ink); }
  .card .growth { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; white-space: nowrap; }
  .growth.good { background: var(--good-bg); color: var(--good-text); }
  .growth.bad  { background: var(--bad-bg);  color: var(--bad-text); }
  .growth.flat { background: var(--flat-bg); color: var(--flat-text); }
  .card .prior { font-size: 9px; color: #8890a0; margin-top: 2px; }

  .chart-card { background: var(--surface-card); border-radius: 8px; padding: 10px 14px; box-shadow: 0 1px 4px rgba(15,37,110,.08); margin-bottom: 16px; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chart-card h3 { margin: 0; font-size: 11.5px; color: var(--sla-color); text-transform: uppercase; letter-spacing: .03em; }
  .chart-metric-toggle { display: flex; gap: 4px; }
  .chart-metric-toggle button {
    font: inherit; font-size: 10.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid #ccd0d8;
    background: #fff; color: var(--ink-secondary); cursor: pointer;
  }
  .chart-metric-toggle button.active { background: var(--sla-color); color: #fff; border-color: var(--sla-color); }
  .chart-wrap { height: 180px; }

  /* ---------- View toggle ---------- */
  .view-toggle { display: flex; gap: 6px; margin: 14px 0 10px; }
  .view-toggle button {
    font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: 1px solid #ccd0d8;
    background: #fff; color: var(--ink-secondary); cursor: pointer; font-size: 12px;
  }
  .view-toggle button.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

  /* ---------- Filters (pill style, not spreadsheet-like) ---------- */
  .filters { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .filter-group { position: relative; }
  .filter-btn {
    font: inherit; padding: 5px 11px; border-radius: 999px; border: 1px solid #ccd0d8;
    background: #fff; color: var(--ink); cursor: pointer; font-size: 11.5px;
  }
  .filter-btn.has-value { border-color: var(--accent-blue); color: var(--accent-blue); font-weight: 700; }
  .filter-menu {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    padding: 6px; min-width: 170px; max-height: 260px; overflow-y: auto;
  }
  .filter-menu.open { display: block; }
  .filter-menu label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .filter-menu label:hover { background: var(--surface-page); }
  .reset-btn { font: inherit; padding: 5px 11px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--ink-secondary); cursor: pointer; font-size: 11.5px; text-decoration: underline; }
  .sort-select { font: inherit; padding: 5px 9px; border-radius: 999px; border: 1px solid #ccd0d8; background: #fff; margin-left: auto; font-size: 11.5px; }
  .result-count { font-size: 10.5px; color: var(--ink-secondary); margin-bottom: 6px; }

  /* ---------- Table ---------- */
  .table-scroll { overflow: auto; max-height: 62vh; background: var(--surface-card); border-radius: 8px; box-shadow: 0 1px 4px rgba(15,37,110,.08); }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  td { padding: 4px 6px; text-align: left; border-bottom: 1px solid #eef0f2; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th {
    position: sticky; top: 0; background: var(--ink); color: #fff; font-weight: 700; font-size: 9px;
    text-transform: uppercase; letter-spacing: .01em; z-index: 5; text-align: center;
    padding: 5px 3px; white-space: normal; line-height: 1.15; vertical-align: bottom;
  }
  td.center { text-align: center; }
  tr.hp-row td { background: var(--hp-row); }
  tr:hover td { background: #F5F8FF; }
  tr.hp-row:hover td { background: #E8ECFA; }
  a.job-link { color: var(--accent-blue); text-decoration: none; }
  a.job-link:hover { text-decoration: underline; }
  td.title-cell, th.title-cell { max-width: 0; } /* forces ellipsis to respect colgroup width */

  .badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; font-weight: 700; font-size: 10.5px; }
  .badge.g { background: var(--good-bg); color: var(--good-text); }
  .badge.y { background: #FFF6DD; color: #8a6d00; }
  .badge.r { background: var(--bad-bg); color: var(--bad-text); }
  .badge.n { background: var(--flat-bg); color: var(--flat-text); }

  .circle { text-align: center; font-size: 12px; }

  select.decision-select { font: inherit; font-size: 11px; padding: 2px 4px; border-radius: 5px; border: 1px solid #ccd0d8; max-width: 100px; }
  .save-btn { font: inherit; font-size: 10px; padding: 2px 7px; border-radius: 5px; border: none; background: var(--accent-cyan); color: #fff; cursor: pointer; margin-left: 3px; }
  .save-btn:disabled { background: #ccd0d8; cursor: default; }
  .save-status { font-size: 9.5px; margin-left: 4px; color: var(--ink-secondary); }
  td.decision-cell { overflow: visible; white-space: nowrap; }

  .hp-legend { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink-secondary); margin-bottom: 8px; }
  .hp-swatch { width: 13px; height: 13px; border-radius: 3px; background: var(--hp-row); border: 1px solid #ccc; }
</style>
</head>
<body>

<div class="titlebar">
  <h1>INTERNAL JOBS TRACKER</h1>
  <div class="sub" id="generatedAtLabel">Loading…</div>
</div>

<div class="wrap">

  <!-- ============ KPI SECTION ============ -->
  <div class="kpi-controls">
    <label class="kpi-note" for="rangeSelect">Period:</label>
    <select id="rangeSelect">
      <option value="current-month">Current month</option>
      <option value="1">Last 1 month</option>
      <option value="2" selected>Last 2 months</option>
      <option value="3">Last 3 months</option>
      <option value="6">Last 6 months</option>
      <option value="12">Last 12 months</option>
      <option value="custom">Custom date range…</option>
    </select>
    <div class="date-range" id="dateRangeInputs">
      <input type="date" id="rangeFrom"> <span class="kpi-note">to</span> <input type="date" id="rangeTo">
      <button id="applyRange" class="kpi-note" style="cursor:pointer;">Apply</button>
    </div>
    <span class="kpi-note" id="periodLabel"></span>
  </div>

  <div class="kpi-section-title" style="background:var(--sla-color)">SLA</div>
  <div class="cards" id="kpiCardsSla"></div>

  <div class="kpi-section-title" style="background:var(--overview-color)">Overview</div>
  <div class="cards" id="kpiCardsOverview"></div>

  <div class="chart-card">
    <div class="chart-head">
      <h3 id="chartTitle">Posted → Hire, median days by month</h3>
      <div class="chart-metric-toggle" id="chartMetricToggle">
        <button data-metric="postedToHireDays" class="active">Posted→Hire</button>
        <button data-metric="postedToClaimedDays">Posted→Claimed</button>
        <button data-metric="claimedToSentDays">Claimed→Sent</button>
        <button data-metric="sentToHireDays">Sent→Hire</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
  </div>

  <!-- ============ VIEW TOGGLE ============ -->
  <div class="view-toggle">
    <button id="tabJob" class="active">Job Level</button>
    <button id="tabTalent">Talent Level</button>
  </div>

  <div class="hp-legend"><span class="hp-swatch"></span> Highlighted rows = the 15 tracked HP (High-Priority) jobs</div>

  <div class="filters" id="filterBar"></div>
  <div class="result-count" id="resultCount"></div>

  <div class="table-scroll">
    <table id="dataTable">
      <colgroup id="colGroup"></colgroup>
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>
const GOOGLE_CLIENT_ID = '57381868856-6d471oasl438l33mg468jbg6o2e3fa7n.apps.googleusercontent.com';
const SHEET_ID = '1n1aqgvOnbdwxJXPzNpe-AMa2mzKBtMeE4q5exXN1rwo';
const DECISION_OPTIONS = ['', 'Core Offer', 'Termination as Talent', 'Extending as Talent'];
const OPEN_STATUSES = ['PENDING_ENGINEER', 'POSTPONED'];

let DATA = null;
let activeView = 'job';
let accessToken = null;
let tokenClient = null;
let monthlyChart = null;

const jobFilterState = { jobStatus: new Set(['ACTIVE']), pcFlag: new Set(), csFlag: new Set(), shFlag: new Set(), phFlag: new Set() };
const talentFilterState = { jobStatus: new Set(['ACTIVE']), onboarding: new Set(), budget: new Set(), trial: new Set(), offboarding: new Set() };
let jobSort = { key: 'postedDate', dir: 'desc' };
let talentSort = { key: 'postedDate', dir: 'desc' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function flagBadge(flag, text) {
  const cls = flag === '🔴' ? 'r' : flag === '🟡' ? 'y' : flag === '🟢' ? 'g' : 'n';
  return `<span class="badge ${cls}">${text}${flag ? ' ' + flag : ''}</span>`;
}

/* ---------------- KPI computation ---------------- */
function periodBounds(rangeVal) {
  const now = new Date();
  let start, end;
  if (rangeVal === 'custom') {
    const fromVal = document.getElementById('rangeFrom').value;
    const toVal = document.getElementById('rangeTo').value;
    start = fromVal ? new Date(fromVal + 'T00:00:00') : new Date(now.getFullYear(), now.getMonth() - 2, 1);
    end = toVal ? new Date(new Date(toVal + 'T00:00:00').getTime() + 86400000) : now;
  } else if (rangeVal === 'current-month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  } else {
    const months = Number(rangeVal);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    start = new Date(now.getFullYear(), now.getMonth() + 1 - months, 1);
  }
  const days = Math.round((end - start) / 86400000);
  const prevEnd = start;
  const prevStart = new Date(start.getTime() - days * 86400000);
  return { start, end, prevStart, prevEnd };
}

function inRange(dateStr, start, end) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  return d >= start && d < end;
}

function median(arr) {
  const v = arr.filter(x => x !== null && x !== undefined).sort((a, b) => a - b);
  if (!v.length) return null;
  const mid = Math.floor(v.length / 2);
  return v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2;
}

function computeSlaKpis(start, end) {
  const talentsInP = DATA.talents.filter(t => inRange(t.postedDate, start, end));
  return {
    postedToClaimed: median(talentsInP.map(t => t.postedToClaimedDays)),
    claimedToSent: median(talentsInP.map(t => t.claimedToSentDays)),
    sentToHire: median(talentsInP.map(t => t.sentToHireDays)),
    postedToHire: median(talentsInP.map(t => t.postedToHireDays)),
  };
}

function computeOverviewKpis(start, end) {
  const inP = DATA.jobs.filter(j => inRange(j.postedDate, start, end));
  const talentsInP = DATA.talents.filter(t => inRange(t.postedDate, start, end));
  // Only jobs with an actual Used figure recorded — many have Approved but no
  // spend posted yet, and including those in the denominator understates % used.
  const withUsage = talentsInP.filter(t => t.budgetUsed !== null);
  const approved = withUsage.reduce((s, t) => s + (t.budgetApproved || 0), 0);
  const used = withUsage.reduce((s, t) => s + (t.budgetUsed || 0), 0);
  return {
    total: inP.length,
    active: inP.filter(j => j.jobStatus === 'ACTIVE').length,
    open: inP.filter(j => OPEN_STATUSES.includes(j.jobStatus)).length,
    closed: inP.filter(j => j.jobStatus === 'CLOSED').length,
    removed: inP.filter(j => j.jobStatus === 'REMOVED').length,
    pctUsed: approved > 0 ? (used / approved * 100) : null,
  };
}

function growthBadge(current, prior, lowerIsBetter) {
  if (current === null || prior === null || prior === 0) return '<span class="growth flat">n/a</span>';
  const pct = ((current - prior) / Math.abs(prior)) * 100;
  const up = pct >= 0;
  const good = lowerIsBetter === null ? null : (lowerIsBetter ? !up : up);
  const cls = Math.abs(pct) < 0.5 ? 'flat' : (good === null ? 'flat' : (good ? 'good' : 'bad'));
  const arrow = up ? '↑' : '↓';
  return `<span class="growth ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
}

function fmtDays(v) { return v === null ? '—' : v.toFixed(1) + 'd'; }
function fmtPct(v) { return v === null ? '—' : v.toFixed(1) + '%'; }
function fmtNum(v) { return v === null ? '—' : v; }

function renderKpis() {
  const rangeVal = document.getElementById('rangeSelect').value;
  const { start, end, prevStart, prevEnd } = periodBounds(rangeVal);
  document.getElementById('periodLabel').textContent =
    `${start.toISOString().slice(0,10)} → ${new Date(end - 1).toISOString().slice(0,10)} vs. prior equal-length period`;

  const curSla = computeSlaKpis(start, end);
  const priorSla = computeSlaKpis(prevStart, prevEnd);
  const curOv = computeOverviewKpis(start, end);
  const priorOv = computeOverviewKpis(prevStart, prevEnd);

  const slaCards = [
    { name: 'Posted → Claimed', value: fmtDays(curSla.postedToClaimed), g: growthBadge(curSla.postedToClaimed, priorSla.postedToClaimed, true), prior: fmtDays(priorSla.postedToClaimed) },
    { name: 'Claimed → Sent', value: fmtDays(curSla.claimedToSent), g: growthBadge(curSla.claimedToSent, priorSla.claimedToSent, true), prior: fmtDays(priorSla.claimedToSent) },
    { name: 'Sent → Hire', value: fmtDays(curSla.sentToHire), g: growthBadge(curSla.sentToHire, priorSla.sentToHire, true), prior: fmtDays(priorSla.sentToHire) },
    { name: 'Posted → Hire', value: fmtDays(curSla.postedToHire), g: growthBadge(curSla.postedToHire, priorSla.postedToHire, true), prior: fmtDays(priorSla.postedToHire) },
  ];
  document.getElementById('kpiCardsSla').innerHTML = slaCards.map(c => `
    <div class="card" style="--cat-color:var(--sla-color)">
      <div class="kpi-name">${c.name}</div>
      <div class="value-row"><span class="value">${c.value}</span>${c.g}</div>
      <div class="prior">Prior period: ${c.prior} · median</div>
    </div>`).join('');

  const ovCards = [
    { name: 'Total Jobs', value: fmtNum(curOv.total), g: growthBadge(curOv.total, priorOv.total, false), prior: fmtNum(priorOv.total) },
    { name: 'Active Jobs', value: fmtNum(curOv.active), g: growthBadge(curOv.active, priorOv.active, false), prior: fmtNum(priorOv.active) },
    { name: 'Open Jobs', value: fmtNum(curOv.open), g: growthBadge(curOv.open, priorOv.open, false), prior: fmtNum(priorOv.open) },
    { name: 'Closed Jobs', value: fmtNum(curOv.closed), g: growthBadge(curOv.closed, priorOv.closed, false), prior: fmtNum(priorOv.closed) },
    { name: 'Removed Jobs', value: fmtNum(curOv.removed), g: growthBadge(curOv.removed, priorOv.removed, true), prior: fmtNum(priorOv.removed) },
    { name: '% Budget Used', value: fmtPct(curOv.pctUsed), g: growthBadge(curOv.pctUsed, priorOv.pctUsed, true), prior: fmtPct(priorOv.pctUsed) },
  ];
  document.getElementById('kpiCardsOverview').innerHTML = ovCards.map(c => `
    <div class="card" style="--cat-color:var(--overview-color)">
      <div class="kpi-name">${c.name}</div>
      <div class="value-row"><span class="value">${c.value}</span>${c.g}</div>
      <div class="prior">Prior period: ${c.prior}</div>
    </div>`).join('');

  lastPeriod = { start, end };
  renderMonthlyChart();
}

const METRIC_LABELS = {
  postedToHireDays: 'Posted → Hire',
  postedToClaimedDays: 'Posted → Claimed',
  claimedToSentDays: 'Claimed → Sent',
  sentToHireDays: 'Sent → Hire',
};
let lastPeriod = null;
let activeChartMetric = 'postedToHireDays';

// Lightweight inline plugin — draws the value above each bar, no extra CDN dependency.
const dataLabelPlugin = {
  id: 'dataLabelPlugin',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      const v = chart.data.datasets[0].data[i];
      if (v === null || v === undefined) return;
      ctx.save();
      ctx.fillStyle = '#262D3D';
      ctx.font = '700 10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(v.toFixed(1), bar.x, bar.y - 5);
      ctx.restore();
    });
  },
};

function renderMonthlyChart() {
  if (!lastPeriod) return;
  const { start, end } = lastPeriod;
  const months = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const endCap = new Date(end.getFullYear(), end.getMonth(), 1);
  while (cursor <= endCap) {
    months.push(new Date(cursor));
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }
  const labels = months.map(m => m.toLocaleString('default', { month: 'short', year: '2-digit' }));
  const values = months.map(m => {
    const mEnd = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    const inMonth = DATA.talents.filter(t => inRange(t.postedDate, m, mEnd));
    return median(inMonth.map(t => t[activeChartMetric]));
  });

  document.getElementById('chartTitle').textContent = `${METRIC_LABELS[activeChartMetric]}, median days by month`;

  const ctx = document.getElementById('monthlyChart');
  if (monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: '#183A9E', borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 16 } },
      plugins: { legend: { display: false } },
      scales: {
        y: { display: false, beginAtZero: true },
        x: { grid: { display: false } },
      },
    },
    plugins: [dataLabelPlugin],
  });
}

document.getElementById('chartMetricToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-metric]');
  if (!btn) return;
  document.querySelectorAll('#chartMetricToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeChartMetric = btn.dataset.metric;
  renderMonthlyChart();
});

/* ---------------- Filters ---------------- */
function uniqueValues(arr, key) { return [...new Set(arr.map(x => x[key]).filter(v => v !== '' && v !== null && v !== undefined))].sort(); }

function buildFilterGroup(id, label, options, stateSet) {
  const active = stateSet.size > 0;
  return `
    <div class="filter-group">
      <button class="filter-btn ${active ? 'has-value' : ''}" data-toggle="${id}">${label}${active ? ` (${stateSet.size})` : ''}</button>
      <div class="filter-menu" id="menu-${id}">
        ${options.map(o => `<label><input type="checkbox" value="${esc(o)}" ${stateSet.has(o) ? 'checked' : ''} data-group="${id}"> ${esc(o)}</label>`).join('')}
      </div>
    </div>`;
}

function renderFilterBar() {
  const bar = document.getElementById('filterBar');
  if (activeView === 'job') {
    bar.innerHTML =
      buildFilterGroup('jobStatus', 'Job Status', uniqueValues(DATA.jobs, 'jobStatus'), jobFilterState.jobStatus) +
      buildFilterGroup('pcFlag', 'Posted→Claimed Flag', ['🟢','🟡','🔴','⚪'], jobFilterState.pcFlag) +
      buildFilterGroup('csFlag', 'Claimed→Sent Flag', ['🟢','🟡','🔴','⚪'], jobFilterState.csFlag) +
      buildFilterGroup('shFlag', 'Sent→Hire Flag', ['🟢','🟡','🔴','⚪'], jobFilterState.shFlag) +
      buildFilterGroup('phFlag', 'Posted→Hire Flag', ['🟢','🟡','🔴','⚪'], jobFilterState.phFlag) +
      `<button class="reset-btn" id="resetFilters">Reset filters</button>
       <select class="sort-select" id="sortSelect">
         <option value="postedDate:desc">Posted date (newest)</option>
         <option value="postedDate:asc">Posted date (oldest)</option>
         <option value="postedToHireDays:desc">Posted→Hire (longest)</option>
         <option value="postedToHireDays:asc">Posted→Hire (shortest)</option>
         <option value="jobTitle:asc">Job Title (A-Z)</option>
       </select>`;
  } else {
    bar.innerHTML =
      buildFilterGroup('jobStatus', 'Job Status', uniqueValues(DATA.talents, 'jobStatus'), talentFilterState.jobStatus) +
      buildFilterGroup('onboarding', 'Onboarding Status', ['🟢','🔴','⚪'], talentFilterState.onboarding) +
      buildFilterGroup('budget', 'Budget Status', ['🟢','🟡','🔴','⚪'], talentFilterState.budget) +
      buildFilterGroup('trial', 'Trial Warning', ['🟢','🟡','🔴','⚪'], talentFilterState.trial) +
      buildFilterGroup('offboarding', 'Offboarding Warning', ['🟢','🔴','⚪'], talentFilterState.offboarding) +
      `<button class="reset-btn" id="resetFilters">Reset filters</button>
       <select class="sort-select" id="sortSelect">
         <option value="postedDate:desc">Posted date (newest)</option>
         <option value="postedDate:asc">Posted date (oldest)</option>
         <option value="talentName:asc">Talent Name (A-Z)</option>
         <option value="decisionDate:asc">55-Day Decision Date</option>
       </select>`;
  }

  bar.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.toggle;
      document.querySelectorAll('.filter-menu').forEach(m => { if (m.id !== `menu-${id}`) m.classList.remove('open'); });
      document.getElementById(`menu-${id}`).classList.toggle('open');
    });
  });
  bar.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const state = activeView === 'job' ? jobFilterState : talentFilterState;
      const set = state[cb.dataset.group];
      if (cb.checked) set.add(cb.value); else set.delete(cb.value);
      renderFilterBar();
      renderTable();
    });
  });
  const resetBtn = document.getElementById('resetFilters');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    const state = activeView === 'job' ? jobFilterState : talentFilterState;
    Object.values(state).forEach(s => s.clear());
    renderFilterBar();
    renderTable();
  });
  const sortSelect = document.getElementById('sortSelect');
  if (sortSelect) {
    const cur = activeView === 'job' ? jobSort : talentSort;
    sortSelect.value = `${cur.key}:${cur.dir}`;
    sortSelect.addEventListener('change', () => {
      const [key, dir] = sortSelect.value.split(':');
      if (activeView === 'job') jobSort = { key, dir }; else talentSort = { key, dir };
      renderTable();
    });
  }
  document.addEventListener('click', () => document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('open')), { once: true });
}

/* ---------------- Table rendering ---------------- */
function applySort(rows, sort) {
  const { key, dir } = sort;
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (av === null || av === undefined) av = dir === 'asc' ? Infinity : -Infinity;
    if (bv === null || bv === undefined) bv = dir === 'asc' ? Infinity : -Infinity;
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function filterJobs() {
  return DATA.jobs.filter(j =>
    (jobFilterState.jobStatus.size === 0 || jobFilterState.jobStatus.has(j.jobStatus))
  );
}

function filterTalents() {
  return DATA.talents.filter(t =>
    (talentFilterState.jobStatus.size === 0 || talentFilterState.jobStatus.has(t.jobStatus)) &&
    (talentFilterState.onboarding.size === 0 || talentFilterState.onboarding.has(t.onboardingStatus)) &&
    (talentFilterState.budget.size === 0 || talentFilterState.budget.has(t.budgetStatus)) &&
    (talentFilterState.trial.size === 0 || talentFilterState.trial.has(t.decisionWarning)) &&
    (talentFilterState.offboarding.size === 0 || talentFilterState.offboarding.has(t.offboardingWarning))
  );
}

// [label, width-in-px, extra-css-class]
const JOB_COLS = [
  ['Job ID', 56], ['Job Posted', 66], ['Job Title', 190, 'title-cell'], ['Status', 70],
  ['Posted→Claimed', 80], ['Claimed→Sent', 80], ['Sent→Hire', 74], ['Posted→Hire', 74],
  ['# AR Sent', 54], ['# Confirmed Apps', 62], ['# Talents Sent', 62],
];
const TALENT_COLS = [
  ['Job ID', 50], ['Job Posted', 64], ['Job Title', 140, 'title-cell'], ['Status', 64], ['Talent Name', 100],
  ['Commitment', 60], ['Wkly Hrs', 42], ['Hrs Warn', 30], ['Onboarding', 32], ['ITOps', 32], ['Core Email', 32],
  ['Topteam', 32], ['Correct Rpt', 32], ['% Used', 40], ['Budget', 30], ['55-Day Dec.', 66],
  ['Decision', 150], ['Trial Warn', 30], ['Req?', 36], ['Job Closed', 34], ['Hrs Rmv', 30],
  ['Email Rmv', 30], ['Topteam Rmv', 34], ['Offb. Warn', 34],
];

function renderColgroupAndHead(cols) {
  document.getElementById('colGroup').innerHTML = cols.map(c => `<col style="width:${c[1]}px">`).join('');
  document.getElementById('tableHead').innerHTML = cols.map(c => `<th class="${c[2]||''}" title="${esc(c[0])}">${esc(c[0])}</th>`).join('');
}

function renderTable() {
  const body = document.getElementById('tableBody');
  const countEl = document.getElementById('resultCount');

  if (activeView === 'job') {
    renderColgroupAndHead(JOB_COLS);
    let rows = applySort(filterJobs(), jobSort);
    rows.sort((a,b) => (b.isHP - a.isHP)); // HP jobs float to top within sort
    countEl.textContent = `${rows.length} of ${DATA.jobs.length} jobs`;
    body.innerHTML = rows.map(j => `
      <tr class="${j.isHP ? 'hp-row' : ''}">
        <td>${esc(j.jobId)}</td>
        <td>${esc(j.postedDate)}</td>
        <td class="title-cell"><a class="job-link" href="${esc(j.jobLink)}" target="_blank" title="${esc(j.jobTitle)}">${esc(j.jobTitle)}</a></td>
        <td class="center">${esc(j.jobStatus)}</td>
        <td class="center">${flagBadge(talentFlagFor(j, 'postedToClaimed'), dayLabel(j, 'postedToClaimed'))}</td>
        <td class="center">${flagBadge(talentFlagFor(j, 'claimedToSent'), dayLabel(j, 'claimedToSent'))}</td>
        <td class="center">${flagBadge(talentFlagFor(j, 'sentToHire'), dayLabel(j, 'sentToHire'))}</td>
        <td class="center">${flagBadge(talentFlagFor(j, 'postedToHire'), dayLabel(j, 'postedToHire'))}</td>
        <td class="center">${j.arSent ?? '—'}</td>
        <td class="center">${j.confirmedApplications ?? '—'}</td>
        <td class="center">${j.talentsSent ?? '—'}</td>
      </tr>`).join('');
  } else {
    renderColgroupAndHead(TALENT_COLS);
    let rows = applySort(filterTalents(), talentSort);
    rows.sort((a,b) => (b.isHP - a.isHP));
    countEl.textContent = `${rows.length} of ${DATA.talents.length} talents`;
    body.innerHTML = rows.map(t => `
      <tr class="${t.isHP ? 'hp-row' : ''}" data-row-ref="${t.rowRef}">
        <td>${esc(t.jobId)}</td>
        <td>${esc(t.postedDate)}</td>
        <td class="title-cell" title="${esc(t.jobTitle)}"><a class="job-link" href="${esc(t.jobLink)}" target="_blank">${esc(t.jobTitle)}</a></td>
        <td>${esc(t.jobStatus)}</td>
        <td>${esc(t.talentName)}</td>
        <td>${esc(t.commitmentType)}</td>
        <td class="center">${t.weeklyHours ?? '—'}</td>
        <td class="circle">${esc(t.hoursWarning)}</td>
        <td class="circle">${esc(t.onboardingStatus)}</td>
        <td class="circle">${esc(t.itopsTicketStatus)}</td>
        <td class="circle">${esc(t.coreEmailStatus)}</td>
        <td class="circle">${esc(t.topteamProfile)}</td>
        <td class="circle">${esc(t.correctReportTopteam)}</td>
        <td class="center">${t.pctUsed !== null ? t.pctUsed.toFixed(0) + '%' : '—'}</td>
        <td class="circle">${esc(t.budgetStatus)}</td>
        <td class="center">${esc(t.decisionDate) || '—'}</td>
        <td class="decision-cell center">
          <select class="decision-select" data-row-ref="${t.rowRef}">
            ${DECISION_OPTIONS.map(o => `<option value="${esc(o)}" ${o === t.decision ? 'selected' : ''}>${o || '(none)'}</option>`).join('')}
          </select>
          <button class="save-btn" data-row-ref="${t.rowRef}" disabled>Save</button>
          <span class="save-status" id="save-status-${t.rowRef}"></span>
        </td>
        <td class="circle">${esc(t.decisionWarning)}</td>
        <td class="center">${esc(t.required)}</td>
        <td class="circle">${esc(t.jobClosedStatus)}</td>
        <td class="circle">${esc(t.hoursRemovedStatus)}</td>
        <td class="circle">${esc(t.coreEmailRemovedStatus)}</td>
        <td class="circle">${esc(t.topteamRemovedStatus)}</td>
        <td class="circle">${esc(t.offboardingWarning)}</td>
      </tr>`).join('');
    wireDecisionEditing();
  }
}

// Job-level SLA cells reuse the talent-level day/flag fields off the same matched row, so a
// day-count and its flag color always come from the same underlying talent row.
const SLA_DAY_KEY = { postedToClaimed: 'postedToClaimedDays', claimedToSent: 'claimedToSentDays', sentToHire: 'sentToHireDays', postedToHire: 'postedToHireDays' };
const SLA_FLAG_KEY = { postedToClaimed: 'postedToClaimedFlag', claimedToSent: 'claimedToSentFlag', sentToHire: 'sentToHireFlag', postedToHire: 'postedToHireFlag' };
function slaRowFor(job, metric) {
  const dayKey = SLA_DAY_KEY[metric];
  return DATA.talents.find(x => x.jobId === job.jobId && x[dayKey] !== null) || DATA.talents.find(x => x.jobId === job.jobId);
}
function dayLabel(job, metric) {
  const t = slaRowFor(job, metric);
  const v = t ? t[SLA_DAY_KEY[metric]] : null;
  return v === null || v === undefined ? '—' : v + 'd';
}
function talentFlagFor(job, metric) {
  const t = slaRowFor(job, metric);
  return t ? t[SLA_FLAG_KEY[metric]] : '';
}

/* ---------------- Editable Decision + Google Sign-In write-back ---------------- */
function wireDecisionEditing() {
  document.querySelectorAll('.decision-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const btn = document.querySelector(`.save-btn[data-row-ref="${sel.dataset.rowRef}"]`);
      btn.disabled = false;
    });
  });
  document.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', () => saveDecision(btn.dataset.rowRef));
  });
}

function ensureTokenClient() {
  if (tokenClient) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: () => {},
  });
}

async function getToken() {
  ensureTokenClient();
  if (accessToken) return accessToken;
  return new Promise((resolve, reject) => {
    tokenClient.callback = (resp) => {
      if (resp.error) return reject(resp);
      accessToken = resp.access_token;
      resolve(accessToken);
    };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}

async function saveDecision(rowRef) {
  const statusEl = document.getElementById(`save-status-${rowRef}`);
  const sel = document.querySelector(`.decision-select[data-row-ref="${rowRef}"]`);
  const btn = document.querySelector(`.save-btn[data-row-ref="${rowRef}"]`);
  statusEl.textContent = 'Signing in…';
  try {
    const token = await getToken();
    statusEl.textContent = 'Saving…';
    const writeUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Talent%20Tracker!AK${rowRef}?valueInputOption=USER_ENTERED`;
    const writeRes = await fetch(writeUrl, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[sel.value]] }),
    });
    if (!writeRes.ok) throw new Error(await writeRes.text());

    // Sheet formulas recalc instantly server-side; re-read the row's offboarding cells.
    statusEl.textContent = 'Refreshing…';
    const readUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Talent%20Tracker!A${rowRef}:AV${rowRef}`;
    const readRes = await fetch(readUrl, { headers: { Authorization: `Bearer ${token}` } });
    const readJson = await readRes.json();
    const r = (readJson.values && readJson.values[0]) || [];
    const t = DATA.talents.find(x => x.rowRef === Number(rowRef));
    if (t && r.length) {
      t.decision = r[36] || '';
      t.decisionWarning = r[37] || '';
      t.required = r[38] || '';
      t.jobClosedStatus = r[40] || '';
      t.hoursRemovedStatus = r[42] || '';
      t.coreEmailRemovedStatus = r[44] || '';
      t.topteamRemovedStatus = r[46] || '';
      t.offboardingWarning = r[47] || '';
    }
    statusEl.textContent = 'Saved ✓';
    btn.disabled = true;
    renderTable();
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Error — try again';
  }
}

/* ---------------- Init ---------------- */
document.getElementById('tabJob').addEventListener('click', () => { activeView = 'job'; document.getElementById('tabJob').classList.add('active'); document.getElementById('tabTalent').classList.remove('active'); renderFilterBar(); renderTable(); });
document.getElementById('tabTalent').addEventListener('click', () => { activeView = 'talent'; document.getElementById('tabTalent').classList.add('active'); document.getElementById('tabJob').classList.remove('active'); renderFilterBar(); renderTable(); });
document.getElementById('rangeSelect').addEventListener('change', () => {
  const isCustom = document.getElementById('rangeSelect').value === 'custom';
  document.getElementById('dateRangeInputs').classList.toggle('active', isCustom);
  if (!isCustom) renderKpis();
});
document.getElementById('applyRange').addEventListener('click', renderKpis);

async function init() {
  const res = await fetch('data/tracker-data.json');
  DATA = await res.json();
  document.getElementById('generatedAtLabel').textContent = `Data as of ${new Date(DATA.generatedAt).toLocaleString()} · refreshed daily`;
  renderKpis();
  renderFilterBar();
  renderTable();
}
init();
</script>
